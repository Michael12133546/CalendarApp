<!DOCTYPE html>
<html>
<head>
  <title>Add Event</title>
  <style>
    body { font-family: sans-serif; margin: 20px; max-width: 480px; }
    p { margin: 10px 0; }
    input, textarea { width: 100%; padding: 6px; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>Add Event</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a href="{% url 'calendar' %}">Cancel</a>
  </form>
</body>
</html>
